<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CODE DNA — See the DNA of your software</title>
  <desc id="desc">A dark, field-journal inspired software anatomy dashboard with project metrics, a file graph, language profile, and evidence cards.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101918"/><stop offset=".55" stop-color="#0b1112"/><stop offset="1" stop-color="#17201b"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#d0eba7"/><stop offset="1" stop-color="#80c88b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a7d77d" stop-opacity=".19"/><stop offset="1" stop-color="#a7d77d" stop-opacity="0"/></radialGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#d0e3d2" opacity=".15"/></pattern>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="620" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="18" fill="url(#grain)"/>
  <ellipse cx="950" cy="130" rx="360" ry="250" fill="url(#glow)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(52 48)">
      <rect width="38" height="38" rx="10" fill="#18251c" stroke="#607a4c"/>
      <path d="M11 8c16 0 0 22 16 22M27 8C11 8 27 30 11 30M13 13h12M12 19h14M13 25h12" fill="none" stroke="#b9e78d" stroke-width="1.6" stroke-linecap="round"/>
      <text x="52" y="25" fill="#e3ece2" font-size="18" font-weight="700" letter-spacing="3">CODE <tspan fill="#b9e78d">DNA</tspan></text>
      <text x="1090" y="23" text-anchor="end" fill="#85968b" font-size="10" letter-spacing="2">LOCAL SOFTWARE INTELLIGENCE</text>
    </g>
    <path d="M52 108H1148" stroke="#35423a"/>
    <text x="58" y="154" fill="#9cbd83" font-size="10" letter-spacing="3">A FIELD GUIDE TO YOUR CODEBASE</text>
    <text x="56" y="201" fill="#eef2e9" font-family="Georgia,serif" font-size="35">See the DNA of your software.</text>
    <text x="58" y="229" fill="#9ca99e" font-size="13">A local-first anatomy report, grounded in files and evidence.</text>
    <g transform="translate(52 265)" filter="url(#shadow)">
      <rect width="1096" height="300" rx="11" fill="#111918" stroke="#39463d"/>
      <path d="M0 48H1096" stroke="#2c3832"/>
      <text x="24" y="30" fill="#dfe8dc" font-family="Georgia,serif" font-size="16">Project readout</text>
      <text x="1070" y="29" text-anchor="end" fill="#9eb77d" font-family="monospace" font-size="9" letter-spacing="1.7">EVIDENCE / STATIC ANALYSIS</text>
      <g transform="translate(20 66)">
        <g fill="#151f1d" stroke="#334039">
          <rect width="192" height="70" rx="7"/><rect x="204" width="192" height="70" rx="7"/><rect x="408" width="192" height="70" rx="7"/><rect x="612" width="192" height="70" rx="7"/><rect x="816" width="240" height="70" rx="7"/>
        </g>
        <g fill="#84958b" font-family="monospace" font-size="8" letter-spacing="1.4"><text x="15" y="20">SOURCE FILES</text><text x="219" y="20">LANGUAGES</text><text x="423" y="20">PACKAGES</text><text x="627" y="20">IMPORT LINKS</text><text x="831" y="20">PROJECT EVIDENCE</text></g>
        <g fill="#e7eee4" font-size="22"><text x="15" y="52">128</text><text x="219" y="52">6</text><text x="423" y="52">34</text><text x="627" y="52">216</text><text x="831" y="52">MANIFESTS + SOURCE</text></g>
      </g>
      <g transform="translate(20 155)">
        <rect width="617" height="124" rx="7" fill="#0f1717" stroke="#2a3731"/>
        <text x="17" y="24" fill="#dce6dc" font-family="Georgia,serif" font-size="13">Folder structure &amp; imports</text>
        <text x="600" y="23" text-anchor="end" fill="#83978a" font-family="monospace" font-size="8">PATH LINKS ≠ IMPORT EVIDENCE</text>
        <g fill="none" stroke="#677c68" stroke-width="1.3" opacity=".8">
          <path d="M78 73L188 54L300 80L414 49L535 74" stroke-dasharray="4 5"/>
          <path d="M188 54L212 103L300 80M414 49L435 103L535 74" opacity=".5"/>
        </g>
        <g fill="#17231c" stroke="#b4da8c" stroke-width="1.5"><circle cx="78" cy="73" r="7"/><circle cx="188" cy="54" r="9"/><circle cx="300" cy="80" r="7"/><circle cx="414" cy="49" r="9"/><circle cx="535" cy="74" r="7"/><circle cx="212" cy="103" r="6"/><circle cx="435" cy="103" r="6"/></g>
        <g fill="#aab8aa" font-family="monospace" font-size="8" text-anchor="middle"><text x="78" y="94">src</text><text x="188" y="72">components</text><text x="300" y="101">graph.mjs</text><text x="414" y="68">core</text><text x="535" y="94">app.js</text><text x="212" y="119">tests</text><text x="435" y="119">styles</text></g>
      </g>
      <g transform="translate(653 155)">
        <rect width="423" height="124" rx="7" fill="#0f1717" stroke="#2a3731"/>
        <text x="17" y="24" fill="#dce6dc" font-family="Georgia,serif" font-size="13">Language composition</text>
        <g transform="translate(17 43)">
          <text y="10" fill="#bac7bb" font-size="9">TypeScript</text><rect x="92" y="3" width="275" height="7" rx="3" fill="#27332c"/><rect x="92" y="3" width="210" height="7" rx="3" fill="url(#accent)"/><text x="390" y="10" text-anchor="end" fill="#a9bb9d" font-family="monospace" font-size="8">76%</text>
          <text y="37" fill="#bac7bb" font-size="9">JavaScript</text><rect x="92" y="30" width="275" height="7" rx="3" fill="#27332c"/><rect x="92" y="30" width="48" height="7" rx="3" fill="#69c7a9"/><text x="390" y="37" text-anchor="end" fill="#a9bb9d" font-family="monospace" font-size="8">17%</text>
          <text y="64" fill="#bac7bb" font-size="9">CSS</text><rect x="92" y="57" width="275" height="7" rx="3" fill="#27332c"/><rect x="92" y="57" width="19" height="7" rx="3" fill="#90b8d0"/><text x="390" y="64" text-anchor="end" fill="#a9bb9d" font-family="monospace" font-size="8">7%</text>
        </g>
        <text x="17" y="112" fill="#75877b" font-family="monospace" font-size="7">ILLUSTRATIVE SAMPLE VALUES</text>
      </g>
    </g>
    <text x="60" y="594" fill="#809084" font-family="monospace" font-size="9" letter-spacing="1.3">PRIVATE BY DEFAULT · STATIC EVIDENCE · RUNS LOCALLY</text>
    <text x="1140" y="594" text-anchor="end" fill="#809084" font-family="monospace" font-size="9">CODE DNA / FIELD NOTE 001</text>
  </g>
</svg>
